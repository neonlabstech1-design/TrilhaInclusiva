<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trilha Inclusiva — Provas Adaptadas AEE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --color-bg:#FAF8F2;
    --color-surface:#FFFFFF;
    --color-primary:#17453D;
    --color-primary-light:#2C6B5C;
    --color-primary-dark:#0E2E28;
    --color-accent:#E2A33B;
    --color-accent-soft:#F6E4C1;
    --color-text:#1C2624;
    --color-text-muted:#5B6B67;
    --color-border:#E2DFD3;
    --color-danger:#B5482F;
    --color-danger-soft:#F6DED6;
    --color-success:#3E7A5F;
    --radius-sm:8px;
    --radius:14px;
    --radius-lg:22px;
    --font-display:'Fraunces', serif;
    --font-body:'Atkinson Hyperlegible', sans-serif;
    --shadow-sm:0 1px 3px rgba(23,69,61,0.08);
    --shadow-md:0 8px 24px rgba(23,69,61,0.10);
    --shadow-lg:0 20px 50px rgba(23,69,61,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--color-bg);
    color:var(--color-text);
    min-height:100vh;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display);color:var(--color-primary-dark);margin:0 0 6px 0;font-weight:600;}
  p{margin:0;}
  button{font-family:var(--font-body);cursor:pointer;}
  input,select,textarea{font-family:var(--font-body);}
  a{color:inherit;}
  :focus-visible{outline:3px solid var(--color-accent);outline-offset:2px;}

  /* ---------- layout shell ---------- */
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 28px;background:var(--color-primary);color:#fff;
    box-shadow:var(--shadow-sm);position:sticky;top:0;z-index:30;
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:1.25rem;font-weight:600;letter-spacing:.2px;}
  .brand .mark{width:30px;height:30px;flex:none;}
  .topbar-right{display:flex;align-items:center;gap:16px;font-size:.92rem;}
  .topbar-right .who{text-align:right;line-height:1.25;}
  .topbar-right .who b{display:block;font-size:.95rem;}
  .topbar-right .who span{color:#CFE3DB;font-size:.8rem;}
  .btn-ghost-light{
    background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.35);
    padding:8px 14px;border-radius:999px;font-size:.85rem;font-weight:700;
  }
  .btn-ghost-light:hover{background:rgba(255,255,255,0.22);}

  .shell{display:flex;flex:1;min-height:0;}
  .sidenav{
    width:220px;flex:none;background:var(--color-surface);border-right:1px solid var(--color-border);
    padding:22px 14px;display:flex;flex-direction:column;gap:4px;
  }
  .sidenav button{
    display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border:none;
    padding:12px 14px;border-radius:var(--radius-sm);color:var(--color-text-muted);font-weight:700;font-size:.92rem;
  }
  .sidenav button svg{flex:none;width:18px;height:18px;}
  .sidenav button:hover{background:var(--color-bg);color:var(--color-text);}
  .sidenav button.active{background:var(--color-primary);color:#fff;}
  .sidenav .foot{margin-top:auto;padding:12px 14px;font-size:.78rem;color:var(--color-text-muted);}

  .main{flex:1;min-width:0;padding:32px;overflow-y:auto;}
  .view{display:none;max-width:1040px;margin:0 auto;}
  .view.active{display:block;animation:fadein .35s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .page-head{margin-bottom:24px;}
  .page-head .eyebrow{
    text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;font-weight:700;color:var(--color-accent);
    margin-bottom:6px;
  }
  .page-head p{color:var(--color-text-muted);max-width:60ch;}

  .card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);}
  .card + .card{margin-top:18px;}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:720px){.grid-2{grid-template-columns:1fr;}}

  label{display:block;font-weight:700;font-size:.85rem;margin-bottom:6px;color:var(--color-primary-dark);}
  .field{margin-bottom:16px;}
  .hint{font-size:.78rem;color:var(--color-text-muted);margin-top:4px;}
  input[type=text],input[type=password],select,textarea{
    width:100%;padding:11px 13px;border:1.5px solid var(--color-border);border-radius:var(--radius-sm);
    background:#fff;font-size:.95rem;color:var(--color-text);
  }
  textarea{resize:vertical;min-height:90px;}
  input:focus,select:focus,textarea:focus{border-color:var(--color-primary-light);}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--color-primary);color:#fff;border:none;padding:12px 20px;border-radius:999px;
    font-weight:700;font-size:.92rem;transition:transform .12s ease, background .15s ease;
  }
  .btn:hover{background:var(--color-primary-light);}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.55;cursor:not-allowed;}
  .btn-accent{background:var(--color-accent);color:var(--color-primary-dark);}
  .btn-accent:hover{background:#eab35a;}
  .btn-outline{background:transparent;color:var(--color-primary);border:1.5px solid var(--color-primary);}
  .btn-outline:hover{background:var(--color-bg);}
  .btn-danger-outline{background:transparent;color:var(--color-danger);border:1.5px solid var(--color-danger-soft);padding:7px 12px;font-size:.78rem;border-radius:8px;font-weight:700;}
  .btn-danger-outline:hover{background:var(--color-danger-soft);}
  .btn-sm{padding:8px 14px;font-size:.82rem;}

  .chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--color-accent-soft);color:#7a5613;
    padding:5px 12px;border-radius:999px;font-size:.78rem;font-weight:700;
  }
  .chip.subtle{background:#EAF2EE;color:var(--color-primary);}

  /* ---------- auth screen ---------- */
  .auth-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:
      radial-gradient(circle at 12% 18%, rgba(226,163,59,0.16), transparent 40%),
      radial-gradient(circle at 88% 82%, rgba(23,69,61,0.14), transparent 45%),
      var(--color-bg);
  }
  .auth-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:0;max-width:920px;width:100%;
    background:var(--color-surface);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-lg);}
  @media(max-width:820px){.auth-grid{grid-template-columns:1fr;}}
  .auth-hero{background:var(--color-primary);color:#fff;padding:44px 38px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
  .auth-hero h1{color:#fff;font-size:2rem;line-height:1.12;margin-bottom:14px;}
  .auth-hero p{color:#CFE3DB;font-size:.95rem;max-width:34ch;}
  .ramp{display:flex;align-items:flex-end;gap:6px;margin:26px 0 8px;}
  .ramp i{display:block;background:var(--color-accent);border-radius:5px 5px 0 0;}
  .ramp i:nth-child(1){width:16px;height:16px;}
  .ramp i:nth-child(2){width:16px;height:30px;}
  .ramp i:nth-child(3){width:16px;height:44px;}
  .ramp i:nth-child(4){width:16px;height:58px;background:#fff;}
  .auth-hero .steps{font-size:.82rem;color:#CFE3DB;display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .auth-hero .steps div{display:flex;gap:8px;align-items:baseline;}
  .auth-hero .steps b{color:var(--color-accent);font-family:var(--font-display);}
  .auth-panel{padding:40px 38px;}
  .tabs{display:flex;gap:4px;background:var(--color-bg);padding:4px;border-radius:999px;margin-bottom:26px;}
  .tabs button{flex:1;background:transparent;border:none;padding:10px;border-radius:999px;font-weight:700;color:var(--color-text-muted);font-size:.88rem;}
  .tabs button.active{background:var(--color-primary);color:#fff;}
  .error-msg{background:var(--color-danger-soft);color:var(--color-danger);padding:10px 13px;border-radius:var(--radius-sm);font-size:.85rem;font-weight:700;margin-bottom:14px;}
  .ok-msg{background:#E4F1EA;color:var(--color-success);padding:10px 13px;border-radius:var(--radius-sm);font-size:.85rem;font-weight:700;margin-bottom:14px;}

  /* ---------- students ---------- */
  .student-list{display:flex;flex-direction:column;gap:12px;margin-top:6px;}
  .student-item{
    display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
    padding:16px;border:1px solid var(--color-border);border-radius:var(--radius);background:var(--color-bg);
  }
  .student-item h4{margin-bottom:4px;font-size:1.02rem;}
  .student-item .meta{color:var(--color-text-muted);font-size:.84rem;margin-top:4px;}
  .empty{
    text-align:center;padding:44px 20px;color:var(--color-text-muted);border:1.5px dashed var(--color-border);
    border-radius:var(--radius);
  }
  .empty svg{width:38px;height:38px;color:var(--color-accent);margin-bottom:10px;}

  /* ---------- trilha stepper (signature element) ---------- */
  .trilha{display:flex;align-items:stretch;gap:0;margin-bottom:26px;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);}
  .trilha .step{
    flex:1;background:var(--color-surface);padding:16px 18px;border-right:1px solid var(--color-border);position:relative;
  }
  .trilha .step:last-child{border-right:none;}
  .trilha .step .n{
    font-family:var(--font-display);font-size:1.4rem;color:var(--color-accent);font-weight:700;line-height:1;
  }
  .trilha .step .t{font-weight:700;font-size:.85rem;margin-top:6px;color:var(--color-primary-dark);}
  .trilha .step.done{background:var(--color-primary);}
  .trilha .step.done .n,.trilha .step.done .t{color:#fff;}
  .trilha .step.done .n{color:var(--color-accent);}

  .upload-box{
    border:1.5px dashed var(--color-border);border-radius:var(--radius);padding:22px;text-align:center;background:var(--color-bg);
    cursor:pointer;
  }
  .upload-box:hover{border-color:var(--color-primary-light);}
  .upload-box svg{width:30px;height:30px;color:var(--color-primary-light);margin-bottom:8px;}
  .preview-img{max-width:100%;max-height:220px;border-radius:var(--radius-sm);margin-top:12px;border:1px solid var(--color-border);}

  .result-box{white-space:pre-wrap;background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius);padding:20px;font-size:.94rem;line-height:1.65;max-height:520px;overflow-y:auto;}
  .loading-row{display:flex;align-items:center;gap:12px;color:var(--color-text-muted);font-weight:700;font-size:.9rem;}
  .spinner{width:20px;height:20px;border-radius:50%;border:3px solid var(--color-accent-soft);border-top-color:var(--color-accent);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .history-item{border:1px solid var(--color-border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;background:var(--color-bg);}
  .history-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;}
  .history-head:hover{background:#F1EEE3;}
  .history-body{display:none;padding:0 16px 16px;}
  .history-body.open{display:block;}

  .toast{
    position:fixed;bottom:22px;right:22px;background:var(--color-primary-dark);color:#fff;padding:13px 18px;
    border-radius:var(--radius-sm);box-shadow:var(--shadow-md);font-weight:700;font-size:.88rem;z-index:100;
    display:flex;align-items:center;gap:10px;max-width:320px;transform:translateY(20px);opacity:0;transition:all .25s ease;
  }
  .toast.show{transform:translateY(0);opacity:1;}
  .toast.err{background:var(--color-danger);}

  .mobile-topnav{display:none;}
  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidenav{width:100%;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--color-border);padding:10px;}
    .sidenav .foot{display:none;}
    .main{padding:20px;}
  }
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
</style>

<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged,
  signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, addDoc, getDocs, deleteDoc, doc, getDoc, setDoc, query, where, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================================================================
   TRILHA INCLUSIVA — apoio ao AEE para adaptação de provas
   Login: Google (Firebase Authentication)
   Dados: Firestore (alunos AEE compartilhados + histórico por professor)
   Geração de prova: IA embutida do Claude OU OpenRouter (chave própria)
   ========================================================================= */

const state = {
  view: 'checking',          // checking | firebaseSetup | auth | app
  authTab: 'login',          // login | register (para o formulário de e-mail)
  authError: '',
  authOk: '',
  authLoading: false,
  currentUser: null,         // {uid, name, email, photo, school, guest}
  activeView: 'students',    // students | newExam | history | aiConfig | firebaseConfig
  students: [],
  exams: [],
  newStudentOpen: false,
  studentError: '',
  examForm: { studentId:'', area:'', subject:'', prompt:'', imageBase64:'', imageMime:'' },
  examLoading: false,
  examResult: '',
  examError: '',
  openHistoryId: null,
  apiConfig: { apiKey: '', model: 'anthropic/claude-sonnet-4.5', remember: false },
  apiConfigSaved: false,
  firebase: { app:null, auth:null, db:null, config:null, ready:false, error:'' },
};

/* Configuração do projeto Firebase "trilha-inclusiva" — já integrada por padrão.
   É seguro deixar isso público: essa config só identifica o projeto, quem
   protege os dados de verdade são as regras do Firestore/Authentication. */
const DEFAULT_FIREBASE_CONFIG = {
  apiKey: "AIzaSyD6LqrgZ86BtEitrL24WQ79sKt7JWj6_2g",
  authDomain: "trilha-inclusiva.firebaseapp.com",
  projectId: "trilha-inclusiva",
  storageBucket: "trilha-inclusiva.firebasestorage.app",
  messagingSenderId: "166990798893",
  appId: "1:166990798893:web:76e429f73d35d2f215d8a4",
  measurementId: "G-4Y4VG8N5Q0"
};

const OPENROUTER_MODELS = [
  { id: 'anthropic/claude-sonnet-4.5', label: 'Claude Sonnet 4.5 (recomendado, lê imagens)' },
  { id: 'openai/gpt-4o', label: 'GPT-4o (lê imagens)' },
  { id: 'google/gemini-2.0-flash-001', label: 'Gemini 2.0 Flash (lê imagens, rápido)' },
  { id: 'meta-llama/llama-3.2-90b-vision-instruct', label: 'Llama 3.2 90B Vision' },
];

/* Detecta se está rodando dentro do ambiente de artefatos do Claude
   (onde a chamada de IA embutida e o armazenamento funcionam sem chave própria). */
const runningInClaudeArtifact = () => (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function');

function loadApiConfigFromLocalStorage(){
  try{
    const raw = window.localStorage && window.localStorage.getItem('trilha-inclusiva:ai-config');
    if(raw){ const parsed = JSON.parse(raw); state.apiConfig = { ...state.apiConfig, ...parsed, remember: true }; state.apiConfigSaved = !!parsed.apiKey; }
  }catch(e){ /* localStorage indisponível — segue com config em memória */ }
}
function persistApiConfig(){
  if(state.apiConfig.remember){
    try{ window.localStorage.setItem('trilha-inclusiva:ai-config', JSON.stringify(state.apiConfig)); }
    catch(e){ toast('Não foi possível salvar a chave neste navegador.', true); }
  }else{
    try{ window.localStorage.removeItem('trilha-inclusiva:ai-config'); }catch(e){}
  }
}

/* ---------------- firebase: config + init ---------------- */
const FIREBASE_CONFIG_KEY = 'trilha-inclusiva:firebase-config';

function loadFirebaseConfigFromLocalStorage(){
  try{
    const raw = window.localStorage && window.localStorage.getItem(FIREBASE_CONFIG_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function saveFirebaseConfigToLocalStorage(cfg){
  try{ window.localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(cfg)); }
  catch(e){ toast('Não foi possível salvar a configuração do Firebase neste navegador.', true); }
}
function clearFirebaseConfig(){
  try{ window.localStorage.removeItem(FIREBASE_CONFIG_KEY); }catch(e){}
  state.firebase = { app:null, auth:null, db:null, config:null, ready:false, error:'' };
}

/* Aceita colar o objeto igual sai do console do Firebase, com ou sem
   "const firebaseConfig = ... ;" ao redor, e com chaves sem aspas. */
function parseFirebaseConfigText(text){
  const start = text.indexOf('{');
  const end = text.lastIndexOf('}');
  if(start === -1 || end === -1 || end < start) throw new Error('Não encontrei um objeto de configuração válido (faltam { }).');
  const slice = text.slice(start, end+1);
  // eslint-disable-next-line no-new-func
  const obj = Function('"use strict"; return (' + slice + ');')();
  const required = ['apiKey','authDomain','projectId','appId'];
  const missing = required.filter(k=>!obj[k]);
  if(missing.length) throw new Error('Faltam campos na configuração: ' + missing.join(', '));
  return obj;
}

function initFirebase(cfg){
  try{
    const app = initializeApp(cfg);
    const auth = getAuth(app);
    const db = getFirestore(app);
    state.firebase = { app, auth, db, config: cfg, ready: true, error: '' };
    onAuthStateChanged(auth, async (user)=>{
      if(user && !state.currentUser){
        await onAuthUser(user);
      }
    });
    getRedirectResult(auth).then(async (result)=>{
      if(result && result.user && !state.currentUser){
        await onAuthUser(result.user);
      }
    }).catch((e)=>{
      state.authError = traduzErroFirebase(e);
      state.authLoading = false;
      render();
    });
    return true;
  }catch(e){
    state.firebase = { app:null, auth:null, db:null, config:cfg, ready:false, error: e.message || String(e) };
    return false;
  }
}

function firebaseReady(){ return state.firebase.ready; }

async function onAuthUser(user){
  let school = '';
  try{
    const ref = doc(state.firebase.db, 'teacherProfiles', user.uid);
    const snap = await getDoc(ref);
    if(snap.exists()){
      school = snap.data().school || '';
    }else{
      await setDoc(ref, { name: user.displayName || '', email: user.email || '', school: '', createdAt: serverTimestamp() });
    }
  }catch(e){ /* segue sem escola preenchida se o Firestore ainda não estiver liberado */ }
  state.currentUser = { uid: user.uid, name: user.displayName || user.email, email: user.email, photo: user.photoURL, school, guest:false };
  await enterApp();
}

async function handleEmailLogin(e){
  e.preventDefault();
  const email = document.getElementById('emLoginEmail').value.trim();
  const pass = document.getElementById('emLoginPass').value;
  state.authError=''; state.authLoading = true; render();
  try{
    const cred = await signInWithEmailAndPassword(state.firebase.auth, email, pass);
    await onAuthUser(cred.user);
  }catch(e2){
    state.authError = traduzErroFirebase(e2);
    state.authLoading = false;
    render();
  }
}

async function handleEmailRegister(e){
  e.preventDefault();
  const name = document.getElementById('emRegName').value.trim();
  const email = document.getElementById('emRegEmail').value.trim();
  const pass = document.getElementById('emRegPass').value;
  if(!name || !email || pass.length < 6){ state.authError = 'Preencha nome, e-mail e uma senha com 6+ caracteres.'; render(); return; }
  state.authError=''; state.authLoading = true; render();
  try{
    const cred = await createUserWithEmailAndPassword(state.firebase.auth, email, pass);
    await updateProfile(cred.user, { displayName: name });
    await onAuthUser({ ...cred.user, displayName: name });
  }catch(e2){
    state.authError = traduzErroFirebase(e2);
    state.authLoading = false;
    render();
  }
}

function traduzErroFirebase(e){
  const code = e && e.code || '';
  const map = {
    'auth/email-already-in-use': 'Já existe uma conta com esse e-mail. Tente entrar em vez de cadastrar.',
    'auth/invalid-email': 'E-mail inválido.',
    'auth/weak-password': 'Senha muito fraca (use 6+ caracteres).',
    'auth/user-not-found': 'Não encontrei conta com esse e-mail.',
    'auth/wrong-password': 'Senha incorreta.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/popup-closed-by-user': 'Janela do Google fechada antes de concluir o login.',
    'auth/configuration-not-found': 'O login ainda não está ativado no seu projeto Firebase. Vá em Firebase Console → Authentication → Sign-in method e ative "Google" e/ou "E-mail/senha".',
    'auth/unauthorized-domain': 'Este domínio não está autorizado no Firebase: ' + (typeof window!=='undefined' ? window.location.hostname : '') + '. Vá em Firebase Console → Authentication → Settings → Authorized domains → Add domain e cole exatamente esse endereço.',
  };
  return map[code] || (e && e.message) || 'Erro ao autenticar.';
}

async function handleEditSchool(){
  const current = state.currentUser.school || '';
  const value = window.prompt('Escola / unidade:', current);
  if(value === null) return;
  state.currentUser.school = value.trim();

function toast(msg, isErr){
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 300); }, 3200);
}

/* ---------------- dados: Firestore (com fallback local para modo visitante) ---------------- */
/* Quando o Firebase está configurado e o usuário entrou com Google, os dados
   vão para o Firestore (persistem de verdade, na nuvem). Sem Firebase configurado
   (ex: modo visitante), usamos memória local só para dar pra testar o fluxo —
   nesse caso os dados somem ao fechar a aba, e isso fica indicado na tela. */
const memoryFallback = { students: [], exams: {} };

async function fetchStudents(){
  if(firebaseReady()){
    try{
      const snap = await getDocs(collection(state.firebase.db, 'students'));
      return snap.docs.map(d=>({ id: d.id, ...d.data() }));
    }catch(e){ toast('Não foi possível carregar os alunos do Firestore.', true); return []; }
  }
  return memoryFallback.students;
}
async function addStudentDoc(student){
  if(firebaseReady()){
    try{
      const ref = await addDoc(collection(state.firebase.db, 'students'), { ...student, createdAt: serverTimestamp() });
      return { id: ref.id, ...student };
    }catch(e){ toast('Erro ao salvar aluno no Firestore: ' + (e.message||e), true); return null; }
  }
  const local = { id: 'local_'+Date.now(), ...student };
  memoryFallback.students.push(local);
  return local;
}
async function deleteStudentDoc(id){
  if(firebaseReady()){
    try{ await deleteDoc(doc(state.firebase.db, 'students', id)); return true; }
    catch(e){ toast('Erro ao remover aluno: ' + (e.message||e), true); return false; }
  }
  memoryFallback.students = memoryFallback.students.filter(s=>s.id!==id);
  return true;
}

async function fetchExams(uid){
  if(firebaseReady()){
    try{
      const q = query(collection(state.firebase.db, 'exams'), where('teacherUid','==', uid));
      const snap = await getDocs(q);
      const list = snap.docs.map(d=>{
        const data = d.data();
        return { id: d.id, ...data, createdAt: data.createdAt && data.createdAt.toDate ? data.createdAt.toDate().toISOString() : data.createdAt };
      });
      list.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
      return list;
    }catch(e){ toast('Não foi possível carregar o histórico.', true); return []; }
  }
  return memoryFallback.exams[uid] || [];
}
async function addExamDoc(record){
  if(firebaseReady()){
    try{
      const ref = await addDoc(collection(state.firebase.db, 'exams'), { ...record, createdAt: serverTimestamp() });
      return { id: ref.id, ...record, createdAt: new Date().toISOString() };
    }catch(e){ toast('Erro ao salvar no histórico: ' + (e.message||e), true); return null; }
  }
  const local = { id: 'local_'+Date.now(), ...record, createdAt: new Date().toISOString() };
  memoryFallback.exams[record.teacherUid] = memoryFallback.exams[record.teacherUid] || [];
  memoryFallback.exams[record.teacherUid].unshift(local);
  return local;
}
async function deleteExamDoc(id, uid){
  if(firebaseReady()){
    try{ await deleteDoc(doc(state.firebase.db, 'exams', id)); return true; }
    catch(e){ toast('Erro ao excluir: ' + (e.message||e), true); return false; }
  }
  memoryFallback.exams[uid] = (memoryFallback.exams[uid]||[]).filter(x=>x.id!==id);
  return true;
}

async function handleGoogleLogin(){
  state.authError=''; state.authLoading = true; render();
  try{
    const provider = new GoogleAuthProvider();
    // signInWithRedirect é mais confiável que popup: evita travamentos
    // por bloqueio de pop-up, extensões ou políticas de terceiros do navegador.
    await signInWithRedirect(state.firebase.auth, provider);
    // a página é redirecionada para o Google aqui; o retorno é tratado
    // em initFirebase() via getRedirectResult().
  }catch(e){
    state.authError = traduzErroFirebase(e);
    state.authLoading = false;
    render();
  }
}

      ` : `<div class="student-list">${state.students.map(studentItemHtml).join('')}</div>`}
    </div>
  `;

  document.getElementById('openAddStudent').onclick = ()=>{ state.newStudentOpen = !state.newStudentOpen; render(); };
  const cancelBtn = document.getElementById('cancelAddStudent');
  if(cancelBtn) cancelBtn.onclick = ()=>{ state.newStudentOpen=false; render(); };
  const form = document.getElementById('studentForm');
  if(form) form.onsubmit = handleAddStudent;

  el.querySelectorAll('[data-del-student]').forEach(btn=>{
    btn.onclick = ()=> handleDeleteStudent(btn.dataset.delStudent);
  });
}

function studentItemHtml(s){
  return `
  <div class="student-item">
    <div>
      <h4>${escapeHtml(s.name)}</h4>
      <span class="chip">${escapeHtml(s.difficulty)}</span>
      <div class="meta">${escapeHtml(s.turma)}${s.notes ? ' · '+escapeHtml(s.notes) : ''}</div>
    </div>
    <button class="btn-danger-outline" data-del-student="${s.id}">Remover</button>
  </div>`;
}

async function handleAddStudent(e){
  e.preventDefault();
  const name = document.getElementById('sName').value.trim();
  const turma = document.getElementById('sTurma').value.trim();
  const difficulty = document.getElementById('sDiff').value;
  const notes = document.getElementById('sNotes').value.trim();
  if(!name || !turma || !difficulty) return;
  const student = { id: 'st_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), name, turma, difficulty, notes, addedBy: state.currentUser.username };
  const prev = state.students;
  state.students = [...state.students, student];
  const ok = await saveStudents(state.students);
  if(!ok){
    state.students = prev;
    state.studentError = 'Não foi possível salvar o aluno agora. Se você abriu este arquivo baixado no navegador (fora do Claude), o armazenamento persistente não fica disponível — use o artefato aqui na conversa.';
    render();
    return;
  }
  state.studentError = '';
  state.newStudentOpen = false;
  toast('Aluno adicionado.');
  render();
}

async function handleDeleteStudent(id){
  state.students = state.students.filter(s=>s.id !== id);
  await saveStudents(state.students);
  if(state.examForm.studentId === id) state.examForm.studentId = '';
  toast('Aluno removido.');
  render();
}

function handleImageUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const result = reader.result; // data:image/png;base64,XXXX
    const [meta, b64] = result.split(',');
    state.examForm.imageMime = meta.match(/data:(.*);base64/)[1];
    state.examForm.imageBase64 = b64;
    render();
  };
  reader.readAsDataURL(file);
}

async function handleGenerateExam(){
  const f = state.examForm;
  const student = state.students.find(s=>s.id === f.studentId);
  state.examError = '';
  if(!student){ state.examError = 'Selecione um aluno.'; render(); return; }
  if(!f.area || !f.subject){ state.examError = 'Informe a área de conhecimento e a matéria/tema.'; render(); return; }

  state.examLoading = true;
  state.examResult = '';
  render();

  const instructions = `Você é um especialista em Atendimento Educacional Especializado (AEE) e em desenho universal para a aprendizagem.
Adapte uma prova escolar para o aluno "${student.name}", da turma ${student.turma}.
Necessidade/dificuldade do aluno: ${student.difficulty}.
${student.notes ? 'Observações do professor sobre o aluno: ' + student.notes + '.' : ''}
Área de conhecimento: ${f.area}. Matéria/tema específico: ${f.subject}.
${f.prompt ? 'Instruções adicionais do professor: ' + f.prompt : ''}

${f.imageBase64 ? 'A imagem anexada mostra a prova original que deve servir de base para a adaptação.' : 'Não há imagem anexada: crie uma prova adaptada plausível para essa área e tema, adequada ao ano/turma informado.'}

Gere a PROVA ADAPTADA completa, em português do Brasil, pronta para impressão, mantendo os mesmos objetivos de aprendizagem avaliados na prova original, mas com linguagem, formato e nível de complexidade adequados à necessidade do aluno (ex: frases mais curtas, menos alternativas, apoio visual descrito em texto, instruções mais diretas, conforme o caso).
Estruture a resposta com: título da prova, cabeçalho para nome/data, e as questões numeradas com enunciados claros e adaptados. Não inclua comentários fora da prova em si.`;

  const content = [];
  if(f.imageBase64){
    content.push({ type: 'image', source: { type: 'base64', media_type: f.imageMime || 'image/png', data: f.imageBase64 } });
  }
  content.push({ type: 'text', text: instructions });

  const hasPersonalKey = !!state.apiConfig.apiKey;

  try{
    let text = '';

    if(runningInClaudeArtifact() && !hasPersonalKey){
      // ---- IA embutida do Claude (só funciona dentro do artefato do Claude) ----
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1000,
          messages: [{ role: 'user', content }]
        })
      });
      const data = await response.json();
      if(data.error){ throw new Error(data.error.message || 'Erro na geração.'); }
      text = (data.content || []).map(b=> b.type==='text' ? b.text : '').filter(Boolean).join('\n');

    } else if(hasPersonalKey){
      // ---- OpenRouter com chave pessoal (uso avançado/testes, configurada no Perfil) ----
      const orContent = [{ type: 'text', text: instructions }];
      if(f.imageBase64){
        orContent.unshift({ type: 'image_url', image_url: { url: `data:${f.imageMime || 'image/png'};base64,${f.imageBase64}` } });
      }
      const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + state.apiConfig.apiKey,
          'HTTP-Referer': (typeof window !== 'undefined' && window.location ? window.location.href : 'https://trilha-inclusiva.local'),
          'X-Title': 'Trilha Inclusiva',
        },
        body: JSON.stringify({
          model: state.apiConfig.model,
          max_tokens: 2000,
          messages: [{ role: 'user', content: orContent }]
        })
      });
      const data = await response.json();
      if(data.error){ throw new Error(data.error.message || 'Erro na geração (OpenRouter).'); }
      const msg = data.choices && data.choices[0] && data.choices[0].message;
      if(typeof msg?.content === 'string'){ text = msg.content; }
      else if(Array.isArray(msg?.content)){ text = msg.content.map(b=> b.text || '').filter(Boolean).join('\n'); }

    } else {
      // ---- Proxy do servidor (Vercel): chave fica escondida no servidor,
      //      nenhum professor precisa configurar nada. ----
      const response = await fetch('/api/generate-exam', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ instructions, imageBase64: f.imageBase64, imageMime: f.imageMime })
      });
      if(response.status === 404){
        throw new Error('IA não configurada neste servidor ainda. Peça para o administrador configurar a chave em Vercel → Project Settings → Environment Variables (OPENROUTER_API_KEY).');
      }
      const data = await response.json();
      if(data.error){ throw new Error(data.error); }
      text = data.text || '';
    }

    if(!text){ throw new Error('A IA não retornou conteúdo. Tente novamente.'); }
    state.examResult = text;

    const record = {
      id: 'ex_'+Date.now(),
      studentId: student.id,
      studentName: student.name,
      difficulty: student.difficulty,
      area: f.area,
      subject: f.subject,
      prompt: f.prompt,
      result: text,
      createdAt: new Date().toISOString(),
    };
    state.exams.unshift(record);
    await saveExams(state.currentUser.username, state.exams);
    toast('Prova adaptada gerada e salva no histórico.');
  }catch(err){
    state.examError = 'Não foi possível gerar a prova agora. ' + (err.message || '');
    toast('Erro ao gerar prova adaptada.', true);
  }finally{
    state.examLoading = false;
    render();
  }
}

    state.apiConfigSaved = false;

/* ---------------- history view ---------------- */
function renderHistoryView(){
  const el = document.getElementById('view-history');
  el.innerHTML = `
    <div class="page-head">
      <div class="eyebrow">Registros</div>
      <h2>Histórico de provas adaptadas</h2>
      <p>Provas geradas por você, organizadas da mais recente para a mais antiga.</p>
    </div>
    <div class="card">
      ${state.exams.length === 0 ? `
        <div class="empty">${ICONS.empty}<p>Nenhuma prova adaptada gerada ainda.</p></div>
      ` : state.exams.map(historyItemHtml).join('')}
    </div>
  `;
  el.querySelectorAll('[data-toggle-h]').forEach(h=>{
    h.onclick = ()=>{
      const id = h.dataset.toggleH;
      state.openHistoryId = state.openHistoryId === id ? null : id;
      render();
    };
  });
  el.querySelectorAll('[data-del-exam]').forEach(btn=>{

}

function historyItemHtml(x){
  const open = state.openHistoryId === x.id;
  const date = new Date(x.createdAt).toLocaleString('pt-BR');
  return `
  <div class="history-item">
    <div class="history-head" data-toggle-h="${x.id}">
      <div>
        <b>${escapeHtml(x.studentName)}</b> · <span class="chip subtle">${escapeHtml(x.area)}</span>
        <div class="meta hint">${escapeHtml(x.subject)} · ${date}</div>
      </div>
      <button class="btn-danger-outline" data-del-exam="${x.id}">Excluir</button>
    </div>
    <div class="history-body ${open?'open':''}">
      <div class="result-box">${escapeHtml(x.result)}</div>
    </div>
  </div>`;
}

/* ---------------- boot ---------------- */
(async function boot(){
  loadApiConfigFromLocalStorage();
  const savedFbConfig = loadFirebaseConfigFromLocalStorage();
  const cfg = savedFbConfig || DEFAULT_FIREBASE_CONFIG;
  initFirebase(cfg);
  state.view = 'auth';
  render();
})();
</script>
